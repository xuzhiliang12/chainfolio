name: chainfolio-server

services:
  app:
    image: ghcr.io/xuzhiliang12/chainfolio:latest
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      COOKIE_SECURE: "true"
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
