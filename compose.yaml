name: chainfolio

services:
  chainfolio:
    image: ghcr.io/xuzhiliang12/chainfolio:latest
    container_name: chainfolio
    restart: unless-stopped
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      COOKIE_SECURE: "false"
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      ETHERSCAN_API_BASE: ${ETHERSCAN_API_BASE:-https://api.etherscan.io/v2/api}
      TOKEN_DISCOVERY_MAX_TOKENS: ${TOKEN_DISCOVERY_MAX_TOKENS:-250}
      TOKEN_DISCOVERY_MAX_LOGS: ${TOKEN_DISCOVERY_MAX_LOGS:-20000}
      TOKEN_DISCOVERY_FULL_HISTORY: ${TOKEN_DISCOVERY_FULL_HISTORY:-false}
      TOKEN_DISCOVERY_HISTORY_BLOCKS: ${TOKEN_DISCOVERY_HISTORY_BLOCKS:-500000}
      TOKEN_DISCOVERY_LOG_CHUNK: ${TOKEN_DISCOVERY_LOG_CHUNK:-50000}
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
